# Pruebas automáticas: H2 en memoria en modo PostgreSQL, con las mismas migraciones Flyway.
spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:h2:mem:sierra_alta_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
    username: ${TEST_DB_USERNAME:sa}
    password: ${TEST_DB_PASSWORD:}

app:
  bootstrap:
    admin:
      username: admin
      password: admin-password-123
    demo-users:
      enabled: true
      password: demo-password-123
