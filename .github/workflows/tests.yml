# Pruebas y cobertura del backend. Corre en cada push (cualquier rama) y en cada pull request:
# compila con el lint de javac, ejecuta todas las pruebas (H2, sin Docker) y genera el reporte de
# cobertura de JaCoCo, que queda como artefacto descargable y resumido en la página de la ejecución.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo a la misma rama cancela la ejecución anterior que siga en curso.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pruebas y cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      lineas: ${{ steps.porcentaje.outputs.lineas }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar, probar y medir cobertura
        # chmod: desde Windows el bit de ejecución de mvnw puede no quedar registrado en git.
        # `verify` ejecuta las pruebas con el agente de JaCoCo y genera target/site/jacoco.
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Porcentaje de líneas cubiertas
        id: porcentaje
        if: always()
        run: |
          csv=target/site/jacoco/jacoco.csv
          [ -f "$csv" ] || exit 0
          awk -F, 'NR > 1 { m += $8; c += $9 } END { if (c + m > 0) printf "lineas=%.1f\n", 100 * c / (c + m) }' "$csv" >> "$GITHUB_OUTPUT"

      - name: Resumen de cobertura
        if: always()
        run: |
          csv=target/site/jacoco/jacoco.csv
          if [ ! -f "$csv" ]; then
            echo "No se generó el reporte de cobertura (revise el paso de pruebas)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Columnas de jacoco.csv: 4-5 instrucciones, 6-7 ramas, 8-9 líneas, 12-13 métodos (perdidas, cubiertas).
          awk -F, 'NR > 1 { im += $4; ic += $5; bm += $6; bc += $7; lm += $8; lc += $9; mm += $12; mc += $13 }
            function pct(c, m) { return (c + m) == 0 ? "—" : sprintf("%.1f %%", 100 * c / (c + m)) }
            END {
              print "## Cobertura del backend (JaCoCo)\n"
              print "| Métrica | Cobertura | Cubiertas / total |"
              print "| --- | ---: | ---: |"
              printf "| Líneas | %s | %d / %d |\n", pct(lc, lm), lc, lc + lm
              printf "| Ramas | %s | %d / %d |\n", pct(bc, bm), bc, bc + bm
              printf "| Instrucciones | %s | %d / %d |\n", pct(ic, im), ic, ic + im
              printf "| Métodos | %s | %d / %d |\n", pct(mc, mm), mc, mc + mm
              print "\nReporte completo: artefacto **cobertura-backend** (abra index.html)."
            }' "$csv" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar el reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: target/site/jacoco/
          if-no-files-found: warn
          retention-days: 30

      - name: Publicar los resultados de las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas-backend
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 30

  # Badge de cobertura del README: en cada push a main publica coverage.json (formato de shields.io)
  # en la rama `badges`, que solo guarda ese archivo. Sin servicios externos ni secretos.
  badge:
    name: Badge de cobertura
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.tests.outputs.lineas != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publicar coverage.json en la rama badges
        env:
          LINEAS: ${{ needs.tests.outputs.lineas }}
          GH_TOKEN: ${{ github.token }}
        run: |
          color=$(awk -v p="$LINEAS" 'BEGIN { print (p >= 90 ? "brightgreen" : p >= 80 ? "green" : p >= 70 ? "yellowgreen" : p >= 60 ? "yellow" : "red") }')
          mkdir badges && cd badges
          git init -q -b badges
          printf '{"schemaVersion":1,"label":"cobertura","message":"%s %%","color":"%s"}\n' "$LINEAS" "$color" > coverage.json
          git add coverage.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Badge de cobertura: $LINEAS % de líneas (${GITHUB_SHA::7})"
          # La rama tiene un solo commit: se reemplaza en cada publicación.
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
